[project]
name = "capsa"
dynamic = ["version"]
description = "Capsa vocabulary trainer: API server and profile tooling"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "click>=8.1",
    "fastapi>=0.115",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
capsa = "capsa.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The single source of the version is VERSION at the repository root (SPEC 9).
[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>\\S+)"

[tool.uv]
# Rebuild the package metadata when the version changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "../VERSION" }]

[tool.hatch.build.targets.wheel]
packages = ["src/capsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
