# Local test environment: one podman pod with Traefik in front of the Capsa web app and API.
# Start/stop with deploy/local/pod.sh (see README). Not used in production.
#
#   http://capsa.localhost:8080/                 the app (browsers treat *.localhost as secure)
#   http://capsa.localhost:8080/api/v1/health    the API
#   https://capsa.localhost:8443/api/v1/health   TLS with Traefik's self-signed default certificate
#   http://localhost:8081/dashboard/             Traefik dashboard
#
# Containers in a pod share one network namespace: Traefik reaches the API on
# 127.0.0.1:8000 and the web app on 127.0.0.1:8090; only Traefik's ports are
# published on the host. /api goes to the API (longer rule, higher priority),
# everything else to the web app.
#
# @REPO@ is replaced by pod.sh with the repository path: the profiles folder
# (including profiles/private) is mounted read-only and never baked into an image.
# The database lives in the named volume capsa-data and survives restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: capsa-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: capsa-traefik-dynamic
data:
  dynamic.yaml: |
    http:
      routers:
        capsa-api:
          rule: "(Host(`capsa.localhost`) || Host(`localhost`)) && PathPrefix(`/api`)"
          entryPoints: [web]
          service: capsa-api
        capsa-api-tls:
          rule: "(Host(`capsa.localhost`) || Host(`localhost`)) && PathPrefix(`/api`)"
          entryPoints: [websecure]
          service: capsa-api
          tls: {}
        capsa-web:
          rule: "Host(`capsa.localhost`) || Host(`localhost`)"
          entryPoints: [web]
          service: capsa-web
        capsa-web-tls:
          rule: "Host(`capsa.localhost`) || Host(`localhost`)"
          entryPoints: [websecure]
          service: capsa-web
          tls: {}
      services:
        capsa-web:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:8090"
        capsa-api:
          loadBalancer:
            healthCheck:
              path: /api/v1/health
              interval: 10s
            servers:
              - url: "http://127.0.0.1:8000"
---
apiVersion: v1
kind: Pod
metadata:
  name: capsa
  labels:
    app: capsa
spec:
  restartPolicy: Always
  containers:
    - name: api
      image: localhost/capsa-api:dev
      env:
        - name: CAPSA_ENV
          value: local
      volumeMounts:
        - name: data
          mountPath: /data
        - name: profiles
          mountPath: /profiles
          readOnly: true
      livenessProbe:
        httpGet:
          path: /api/v1/health
          port: 8000
        initialDelaySeconds: 3
        periodSeconds: 30

    - name: web
      image: localhost/capsa-web:dev

    - name: traefik
      image: docker.io/library/traefik:v3
      args:
        - --entrypoints.web.address=:8080
        - --entrypoints.websecure.address=:8443
        - --entrypoints.traefik.address=:8081
        - --api.dashboard=true
        - --api.insecure=true
        - --providers.file.directory=/etc/traefik/dynamic
        - --providers.file.watch=true
        - --accesslog=true
        - --log.level=INFO
      ports:
        - containerPort: 8080
          hostPort: 8080
        - containerPort: 8443
          hostPort: 8443
        - containerPort: 8081
          hostPort: 8081
      volumeMounts:
        - name: traefik-dynamic
          mountPath: /etc/traefik/dynamic
          readOnly: true

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: capsa-data
    - name: profiles
      hostPath:
        path: "@REPO@/profiles"
        type: Directory
    - name: traefik-dynamic
      configMap:
        name: capsa-traefik-dynamic
