<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Capsa: a Roman cylindrical container for scrolls. -->
  <rect width="512" height="512" rx="96" fill="#1d4e5f"/>
  <!-- lid, leaning against the container -->
  <path d="M352 236 l40 -12 l34 196 l-40 12 z" fill="#e0a03a"/>
  <!-- scrolls sticking out -->
  <rect x="160" y="118" width="58" height="110" rx="10" fill="#f4f1ea" stroke="#1d4e5f" stroke-width="8"/>
  <rect x="220" y="92" width="66" height="136" rx="10" fill="#e9e2d2" stroke="#1d4e5f" stroke-width="8"/>
  <rect x="288" y="132" width="54" height="96" rx="10" fill="#f4f1ea" stroke="#1d4e5f" stroke-width="8"/>
  <!-- body -->
  <path d="M120 210 v170 a116 34 0 0 0 232 0 v-170" fill="#f4f1ea"/>
  <ellipse cx="236" cy="210" rx="116" ry="34" fill="none" stroke="#1d4e5f" stroke-width="8"/>
  <path d="M120 300 a116 34 0 0 0 232 0" fill="none" stroke="#1d4e5f" stroke-width="8" opacity="0.35"/>
</svg>
