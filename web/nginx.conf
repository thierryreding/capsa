# Static files of the single-page app. TLS, routing and /api are handled by the
# reverse proxy in front of it.
server {
    # Not published; only the reverse proxy reaches it (pod loopback or container network).
    listen 8090;
    root /usr/share/nginx/html;
    server_tokens off;

    # Hashed build files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the app shell; always revalidate so updates arrive.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
        try_files $uri /index.html;
    }
}
